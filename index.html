<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>fdm</title>
<meta name="description" content="fdm: tus cuentas, tus gastos y lo que ya tenés planeado gastar, en un solo lugar.">
<meta name="theme-color" content="#f3efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="fdm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-negro.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-negro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%}
/* La pantalla no se mueve de costado ni hace zoom; solo el contenido se mueve para arriba y abajo, y la barra de abajo queda quieta */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
#scroll{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
button,a,input,select,[role=button]{touch-action:manipulation}
input,select,textarea{font-size:max(16px,1em)}
[hidden]{display:none!important}
/* Layout: one-column phone app, a ledger on warm paper. Money in is green, money out is brick red, planned money is amber. Single committed light look. */
:root{
  --paper:#f3efe6; --card:#fffdf8; --line:#e2dccd; --line-2:#cfc7b4;
  --ink:#1c2620; --muted:#6b7266; --faint:#9aa093;
  --green:#1f6f4f; --green-2:#e3f0e8; --red:#b23a2a; --red-2:#f7e4df; --amber:#a86a0c; --amber-2:#f8ecd3;
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--ink);color:var(--paper);font-weight:700;padding:12px 16px;min-height:48px}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.small{min-height:38px;padding:7px 12px;font-size:.92rem}
.btn.danger{background:var(--red);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
input[type=text],input[type=number],input[type=date],select{width:100%;max-width:100%;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);min-height:46px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.err{color:var(--red);font-weight:600}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:4px}
.brand{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.02em}
.brand span{color:var(--green)}
.mast .today{color:var(--muted);font-size:.9rem}

.card{background:var(--card);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 0 0 1px var(--line)}
.card h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
/* En el iPhone la fecha tiene un ancho propio y se salía del borde: que use el lugar que tiene */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto}
.seg{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;font-weight:700;padding:9px 0;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.check{display:flex;gap:10px;align-items:center}
.check input{width:20px;height:20px;accent-color:var(--green)}

/* Resumen */
.hero{display:flex;flex-direction:column;gap:18px}
.cur{display:flex;flex-direction:column;gap:14px}
.cur+.cur{border-top:1px dashed var(--line-2);padding-top:18px}
.left{display:flex;flex-direction:column;gap:2px}
.left .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,10vw,2.8rem);line-height:1.05;letter-spacing:-.01em}
.left .big.neg{color:var(--red)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .chip:nth-child(3){grid-column:1/-1}
.chip{border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:3px}
.chip .v{font-weight:700;font-size:1.05rem}
.chip.bank{background:var(--green-2)}.chip.bank .v{color:var(--green)}
.chip.plan{background:var(--amber-2)}.chip.plan .v{color:var(--amber)}
.chip .k{font-size:.78rem;color:var(--muted);font-weight:600}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.bar .track{grid-column:1/-1;height:7px;background:var(--paper);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--red);border-radius:4px}

/* Listas */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:15px 0;border-top:1px solid var(--line);align-items:center;text-align:left;width:100%;border-radius:0}
/* Cuotas con casilla para tildar */
.item.cuo{grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px}
.item.cuo .cuob{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;padding:0;border-radius:0}
.item.cuo .a{grid-row:auto;grid-column:3}
.item.cuo .s{white-space:normal}
.tick{width:32px;height:32px;border-radius:9px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;font-weight:800;font-size:1rem;color:#fff;flex:0 0 auto;padding:0}
.tick.on{background:var(--green);box-shadow:none}
.tick:disabled{opacity:.35}
.cuolist{display:flex;flex-direction:column;gap:8px}
.cuoli{display:flex;align-items:center;gap:10px;font-size:.95rem}
.cuoli .box{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line-2);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff;flex:0 0 auto}
.cuoli.ok .box{background:var(--green);box-shadow:none}
.cuoli.ok{color:var(--muted)}
.cuorow{display:grid;grid-template-columns:auto minmax(0,1fr) 38%;gap:6px 10px;align-items:center}
.cuomid{display:flex;flex-direction:column;gap:4px;min-width:0}
.cuorow input{min-height:40px;padding:7px 10px}
.cuoli .tick{width:28px;height:28px;border-radius:8px;font-size:.85rem}
.cuogrp{display:flex;flex-direction:column;gap:10px}
.cuogrp+.cuogrp{border-top:1px solid var(--line);padding-top:16px}
.item:first-child{border-top:0}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:.82rem;color:var(--muted);grid-column:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{font-weight:700;grid-row:1/span 2;grid-column:2;text-align:right}
.item .a.out{color:var(--red)}.item .a.in{color:var(--green)}.item .a.plan{color:var(--amber)}
.day{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:18px 0 4px}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--amber-2);color:var(--amber);margin-left:6px;vertical-align:1px}
.tag.late{background:var(--red-2);color:var(--red)}

.acct{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.acct:first-child{border-top:0}
.acct .n{font-weight:700}
.acct .b{font-weight:700;text-align:right}
.acct .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select{flex:1 1 130px;min-height:40px;padding:7px 10px}
.totline{display:flex;justify-content:space-between;gap:10px;font-weight:700;padding-top:4px}

/* Barra de pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.78rem;font-weight:700;color:var(--faint)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--ink)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:2rem;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(31,111,79,.35);z-index:11}

/* Hoja (formularios) */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(28,38,32,.38)}
.sheet .panel{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:1.4rem}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100vw - 32px);text-align:center}
.preview{font-size:.85rem;border:1px solid var(--line);border-radius:10px;padding:4px 10px;max-height:220px;overflow:auto}
.preview .item{padding:7px 0}
.preview .dup{opacity:.45}
/* Mes por mes */
.msum{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:.98rem}
.msum span{color:var(--muted)}
.msum .end{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-weight:700;color:var(--ink)}
.ahead{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:.95rem;color:var(--muted)}
.ahead b{color:var(--ink)}.ahead b.neg{color:var(--red)}
.tag.done{background:var(--green-2);color:var(--green)}
/* Monto en pesos o dólares */
.amt{display:flex;gap:8px}.amt input{flex:1;min-width:0}
.seg.curseg{flex:0 0 auto}.seg.curseg button{padding:9px 12px;flex:0 0 auto}
.curbtn{flex:0 0 auto;min-width:58px;border-radius:10px;font-weight:800;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.curbtn.usd{background:var(--green-2);color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.fxl{display:grid;grid-template-columns:1fr auto;gap:8px 14px}
.fxl .on{font-weight:700;color:var(--green)}
.edit{font-size:.82rem;font-weight:700;color:var(--green);text-decoration:underline;padding:2px 0 2px 8px}
button.chip{text-align:left;font:inherit;cursor:pointer}
/* Anotar rápido */
.quick{gap:10px}
.qrow{display:flex;gap:10px;flex-wrap:wrap}
.qrow select{flex:1 1 100%}
.qrow input,.qrow select{min-width:0}
#qAmt{flex:0 0 38%;font-size:1.25rem;font-weight:700}
#qDesc{flex:1}
.qrow .btn{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:8px 14px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-2);font-size:.9rem;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<main id="scroll"><div id="app"></div></main>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<button class="fab" id="fab" aria-label="Agregar">+</button>
<div id="sheet" class="sheet" hidden><div class="panel" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
// ---------- Datos: todo queda guardado en este celular ----------
const KEY = "fdm:data";
const CATS = ["Supermercado","Comida","Transporte","Servicios","Alquiler y hogar","Salud","Educación","Ocio","Compras","Impuestos","Tarjeta","Transferencias","Sueldo","Rendimientos","Otros"];
const GUESS = [
  ["Supermercado", /super|carrefour|coto|\bdia\b|jumbo|disco|vea|chango|walmart|maxiconsumo|almac|verduler|carnic/i],
  ["Comida", /rest|pizz|burger|mcdonald|cafe|café|bar |rappi|pedidosya|delivery|helad|panader|starbucks/i],
  ["Transporte", /ypf|shell|axion|nafta|combust|sube|uber|cabify|didi|peaje|estacion|taxi|subte|tren/i],
  ["Servicios", /edenor|edesur|metrogas|naturgy|aysa|personal|movistar|claro|telecentro|fibertel|netflix|spotify|disney|hbo|amazon prime|youtube|internet|luz|gas |agua/i],
  ["Alquiler y hogar", /alquiler|expensas|consorcio|ferreter|easy|sodimac|hogar/i],
  ["Salud", /farmac|osde|swiss|galeno|medic|prepaga|hospital|clinic|odont/i],
  ["Educación", /colegio|escuela|universidad|curso|libreria|librería/i],
  ["Ocio", /cine|teatro|steam|playstation|xbox|ticket|entrada|gym|gimnasio/i],
  ["Compras", /mercadolibre|mercado libre|meli|falabella|zara|garbarino|fravega|frávega|shop|tienda/i],
  ["Impuestos", /afip|arca|arba|agip|impuesto|iibb|ganancias|sellos|abl|patente|monotributo/i],
  ["Tarjeta", /pago tarjeta|pago de tarjeta|visa|mastercard|amex|american express|resumen/i],
  ["Rendimientos", /rendimiento|intereses? ganad/i],
  ["Sueldo", /sueldo|haberes|salario|remuneraci|aguinaldo/i],
  ["Transferencias", /transf|cvu|cbu|debin|alias/i],
];
const guessCat = (desc, amount) => {
  const plain = norm(desc);
  for (const [c, re] of GUESS) if (re.test(desc) || re.test(plain)) return c;
  return amount > 0 ? "Transferencias" : "Otros";
};

// ---------- Dólar: cotización de internet para anotar en dólares ----------
const FX_KEY = "fdm:fx", FX_NAMES = { oficial: "Oficial", tarjeta: "Tarjeta", blue: "Blue", bolsa: "MEP", contadoconliqui: "CCL", mayorista: "Mayorista", cripto: "Cripto" };
let fx = null;
try { fx = JSON.parse(localStorage.getItem(FX_KEY)); } catch {}
// Con impuestos: dólar tarjeta (oficial + 30%). Sin impuestos: el que elijas (oficial si no elegiste)
const fxBase = () => db.fxBase || (db.fxCasa && db.fxCasa !== "tarjeta" ? db.fxCasa : "oficial");
const fxTaxDefault = () => db.fxTax !== false;
const TAX = 1.3;
function usdRate(tax = fxTaxDefault()) {
  if (db.fxManual) return round2(db.fxManual * (tax ? TAX : 1));
  const l = fx?.list || [], of = l.find(x => x.casa === "oficial")?.venta;
  if (tax) return l.find(x => x.casa === "tarjeta")?.venta || (of ? round2(of * TAX) : null);
  return l.find(x => x.casa === fxBase())?.venta || of || null;
}
const fxLabel = (tax = fxTaxDefault()) => tax ? "con impuestos" : "sin impuestos";
function conv(v, from, to, tax = fxTaxDefault()) {
  if (from === to) return v;
  const r = usdRate(tax); if (!r) return null;
  if (from === "USD" && to === "ARS") return round2(v * r);
  if (from === "ARS" && to === "USD") return round2(v / r);
  return null;
}
async function getJSON(url) { const c = new AbortController(), t = setTimeout(() => c.abort(), 9000); try { const r = await fetch(url, { cache: "no-store", signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(t); } }
async function fetchFx() {
  let list = null;
  try {
    list = (await getJSON("https://dolarapi.com/v1/dolares")).filter(x => x && x.casa && x.venta).map(x => ({ casa: x.casa, nombre: FX_NAMES[x.casa] || x.nombre, compra: x.compra, venta: x.venta, fecha: x.fechaActualizacion }));
  } catch {}
  if (!list?.length) {
    try {
      const d = await getJSON("https://api.bluelytics.com.ar/v2/latest");
      list = [["oficial", d.oficial], ["blue", d.blue]].filter(([, v]) => v?.value_sell).map(([casa, v]) => ({ casa, nombre: FX_NAMES[casa], compra: v.value_buy, venta: v.value_sell, fecha: d.last_update }));
    } catch {}
  }
  if (!list?.length) return false;
  fx = { at: Date.now(), list };
  try { localStorage.setItem(FX_KEY, JSON.stringify(fx)); } catch {}
  refreshUsd(); render();
  return true;
}
// Lo planeado en dólares sigue al dólar del día
function refreshUsd() {
  let ch = false;
  for (const p of db.planned) if (p.usd) { const a = conv(p.usd, "USD", p.currency, p.tax !== false); if (a != null && a !== p.amount) { p.amount = a; ch = true; } }
  if (ch) save();
}
const usdNote = o => o?.cur === "USD" ? `US$ ${new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 }).format(o.amount)} a ${money(o.rate, "ARS")}${o.tax === false ? " sin impuestos" : o.tax ? " con impuestos" : ""}` : "";
// Campo de monto con $ / US$: muestra la conversión y devuelve el monto en la moneda de la cuenta
const amtHTML = (val, label = "Monto") => `<div class="field"><span class="label">${label}</span><div class="amt"><input type="text" inputmode="decimal" id="fAmt" placeholder="0,00" value="${val ? new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 }).format(val) : ""}"><div class="seg curseg" id="fAmtCur"><button type="button" data-c="ARS">$</button><button type="button" data-c="USD">US$</button></div></div><div class="seg" id="fTax" hidden><button type="button" data-t="1">Con impuestos</button><button type="button" data-t="0">Sin impuestos</button></div><p class="muted small" id="fFx"></p></div>`;
function bindAmt(b, acctCur, startCur, startTax = fxTaxDefault()) {
  let cur = startCur, tax = startTax;
  const inp = b.querySelector("#fAmt"), segs = b.querySelectorAll("#fAmtCur button"), out = b.querySelector("#fFx"), taxSeg = b.querySelector("#fTax");
  const show = () => {
    segs.forEach(x => x.setAttribute("aria-pressed", x.dataset.c === cur));
    taxSeg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", (x.dataset.t === "1") === tax));
    const v = Math.abs(parseAmount(inp.value)), ac = acctCur();
    taxSeg.hidden = cur === ac;
    if (cur === ac) { out.textContent = ""; return; }
    const r = usdRate(tax);
    if (!r) { out.textContent = "No pude ver a cuánto está el dólar. Ponelo a mano en Cuentas → Dólar."; return; }
    out.textContent = v ? `≈ ${money(conv(v, cur, ac, tax), ac)} (${fxLabel(tax)}: ${money(r, "ARS")})` : `Se pasa a ${ac === "ARS" ? "pesos" : ac} ${fxLabel(tax)}: ${money(r, "ARS")} el dólar.`;
  };
  segs.forEach(x => (x.onclick = () => { cur = x.dataset.c; show(); }));
  taxSeg.querySelectorAll("button").forEach(x => (x.onclick = () => { tax = x.dataset.t === "1"; db.fxTax = tax; save(); show(); }));
  inp.addEventListener("input", show); show();
  return {
    show,
    read() {
      const v = Math.abs(parseAmount(inp.value)); if (!v) return null;
      const ac = acctCur(); if (cur === ac) return { amount: v };

function resetMonth(mk) {

  if (st.changed.length) lines.push(`• Cambios solo de este mes en: ${st.changed.map(p => p.desc).join(", ")}`);
  if (st.carry.length) lines.push(`• Lo que anotaste que te sobró del mes anterior`);
  let last = monthKey(todayISO());
  for (const c of currencies()) for (const m of projection(c)) if (m.mk > last) last = m.mk;

  }
  html += `</div></section>

  <section class="card"><h2>Traer los movimientos del banco</h2>
    <p class="small">Si tu banco no deja exportar (como Ualá), sacá <b>capturas de pantalla</b> de la lista de movimientos y subilas en <b>Importar movimientos</b>: fdm lee las imágenes en el celular, sin mandarlas a ningún lado. También acepta el resumen en PDF, un CSV o texto pegado. Los que ya estaban no se repiten.</p></section>
  <section class="card"><h2>Copia de seguridad</h2>

    <div class="row"><button class="btn ghost" data-act="backup">Guardar copia</button><button class="btn ghost" data-act="restore">Cargar copia</button></div></section>
  <section class="card"><h2>Empezar de cero</h2>

    <button class="btn danger" data-act="wipe">Borrar todo y empezar de cero</button></section>`;
  return html;
}

let toastT;

// Acepta "1.234,56", "1234.56", "$ 1.500"
function parseAmount(s) {
  if (typeof s === "number") return s;
  let x = String(s ?? "").trim();
  if (!x) return NaN;
  let neg = false, mult = 1;
  // "327 mil", "327k", "1,5 millones"
  const mm = x.match(/\s*(mil|k|millon(es)?|millón|palos?|m)\.?$/i);
  if (mm) { mult = /^(mil|k)$/i.test(mm[1]) ? 1e3 : 1e6; x = x.slice(0, mm.index); }
  if (/^\(.*\)$/.test(x)) { neg = true; x = x.slice(1, -1); }
  x = x.replace(/[−–]/g, "-").replace(/[^\d,.\-]/g, "");
  if (x.includes("-")) { neg = !neg; x = x.replace(/-/g, ""); }
  const lc = x.lastIndexOf(","), ld = x.lastIndexOf(".");
  if (lc >= 0 && ld >= 0) x = lc > ld ? x.replace(/\./g, "").replace(",", ".") : x.replace(/,/g, "");
  else if (lc >= 0) x = /,\d{1,2}$/.test(x) && x.split(",").length === 2 ? x.replace(",", ".") : x.replace(/,/g, "");
  else if (ld >= 0 && /^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g, "");
  const n = parseFloat(x) * mult;
  return isNaN(n) ? NaN : round2(neg ? -n : n);
}

      if (r.error) { err.textContent = r.error; err.hidden = false; return; }
      // Si no cambió lo que pusiste en dólares, se mantiene la cotización de ese día
      const keep = t?.orig && r.orig && t.orig.amount === r.orig.amount && t.orig.cur === r.orig.cur && (t.orig.tax ?? true) === r.orig.tax && t.accountId === acctSel.value;
      const amt = keep ? Math.abs(t.amount) : r.amount;
      const date = b.querySelector("#fDate").value || todayISO();
      const rec = { accountId: acctSel.value, amount: kind === "out" ? -Math.abs(amt) : Math.abs(amt), desc: desc.value.trim(), cat: cat.value, date, orig: keep ? t.orig : r.orig || undefined };
      if (!rec.orig) delete rec.orig;
      if (isNew) db.txs.push({ id: uid(), created: Date.now(), src: "manual", ...rec });
      else { Object.assign(t, rec); if (!rec.orig) delete t.orig; }
      rememberAccount(rec.accountId);
      save(); closeSheet(); render(); toast(isNew ? "Anotado" : "Guardado");
    };
    const del = b.querySelector("#fDel");
    if (del) del.onclick = () => { if (!confirm("¿Borrar este movimiento?")) return; db.txs = db.txs.filter(x => x !== t); save(); closeSheet(); render(); };
  });
}
function lastAccount() { try { const id = localStorage.getItem("fdm:lastAcct"); if (acctById(id)) return id; } catch {} return db.accounts[0]?.id; }
function rememberAccount(id) { try { localStorage.setItem("fdm:lastAcct", id); } catch {} }

// La próxima vez que toca algo que se repite: este mes si todavía no pasó ni se cobró/pagó, si no el que viene
function nextDue(day, id) {
  const t = todayISO(), now = monthKey(t), d = dayIn(now, day);
  const doneNow = id && db.txs.some(x => x.plannedId === id && monthKey(x.date) === now);
  return d < t || doneNow ? dayIn(addMonths(now, 1), day) : d;
}

    </div>

    <div id="fCuoBox">
      <div class="seg" id="fCuoMode"><button type="button" data-m="each">El monto es de cada cuota</button><button type="button" data-m="total">Es el total</button></div>
      <div id="fIntWrap" style="margin-top:12px">
        <div class="seg" id="fIntOn"><button type="button" data-i="0">Sin interés</button><button type="button" data-i="1">Con interés</button></div>
        <div class="row" id="fIntBox" style="margin-top:12px;align-items:flex-end"><label class="field" style="flex:0 1 120px"><span class="label">Interés %</span><input type="text" inputmode="decimal" data-plain id="fIntR" placeholder="Ej. 20" value="${v.cuotas?.int ? new Intl.NumberFormat("es-AR").format(v.cuotas.int.rate) : ""}"></label>
        <div class="seg" id="fIntKind" style="flex:1"><button type="button" data-k="rec">Recargo total</button><button type="button" data-k="tna">TNA (anual)</button></div></div>
      </div>
      <div class="row" style="margin-top:12px"><label class="field"><span class="label">Cuántas cuotas</span><input type="number" inputmode="numeric" min="2" max="72" id="fCuoN" value="${v.cuotas?.n || ""}" placeholder="Ej. 6"></label>
      <label class="field"><span class="label">Ya pagaste</span><input type="number" inputmode="numeric" min="0" id="fCuoP" value="${v.cuotas?.paid || 0}"></label></div>
      <p class="muted small" id="fCuoTxt" style="margin-top:8px"></p>
    </div>
    <p class="err" id="fErr" hidden></p>
    ${isNew ? `<button class="btn" id="fOk">Agregar</button>` : `<button class="btn" id="fPaid" style="background:var(--green)"></button><div class="row"><button class="btn ghost" id="fOk">Guardar cambios</button><button class="btn danger" id="fDel">Borrar</button></div>`}
    <button class="btn ghost" data-close>Cancelar</button>`, b => {
    const desc = b.querySelector("#fDesc"), cat = b.querySelector("#fCat"), acct = b.querySelector("#fAcct");
    // Va en la moneda de la cuenta; si lo ponés en dólares se guarda cuántos y sigue al dólar del día
    const planCur = () => acctById(acct.value)?.currency || p?.currency || "ARS";
    const amtW = bindAmt(b, planCur, v.usd ? "USD" : planCur(), v.tax ?? fxTaxDefault());
    let catTouched = !isNew;
    const segs = b.querySelectorAll("#fKind button"), paidBtn = b.querySelector("#fPaid");
    const paint = () => { segs.forEach(s => s.setAttribute("aria-pressed", s.dataset.k === kind)); if (paidBtn) paidBtn.textContent = kind === "in" ? "Ya lo cobré" : "Ya lo pagué"; };
    const autoCat = () => { if (catTouched) return; const g = guessCat(desc.value, kind === "in" ? 1 : -1); cat.value = kind === "in" && g === "Transferencias" ? "Sueldo" : g; };
    segs.forEach(s => (s.onclick = () => { kind = s.dataset.k; autoCat(); paint(); }));
    paint();
    cat.onchange = () => (catTouched = true);
    desc.oninput = autoCat;
    acct.onchange = amtW.show;
    const mon = b.querySelector("#fMon"), cuo = b.querySelector("#fCuo"), cuoN = b.querySelector("#fCuoN"), cuoP = b.querySelector("#fCuoP");
    let cuoMode = v.cuoMode || (v.cuotas?.price ? "total" : "each"), intOn = !!v.cuotas?.int, intKind = v.cuotas?.int?.kind || "rec";
    // Lo que se paga de más por cuota: recargo sobre el total o tasa anual con cuotas fijas (como las tarjetas)
    const intFactor = n => {
      const rate = Math.abs(parseAmount(b.querySelector("#fIntR").value));
      if (!intOn || cuoMode !== "total" || !rate) return 1;
      if (intKind === "rec") return 1 + rate / 100;
      const i = rate / 100 / 12;
      return n * i / (1 - Math.pow(1 + i, -n));
    };
    // Cuántas cuotas, cuánto cada una y cuándo es la última
    const cuoInfo = () => {
      const n = +cuoN.value, paid = +cuoP.value || 0, r = amtW.read();
      if (!n || !r || r.error) return null;
      const f = intFactor(n), each = cuoMode === "total" ? round2(r.amount * f / n) : r.amount;

        price: cuoMode === "total" ? (r.usd || r.amount) : null, int: extra ? { kind: intKind, rate } : null,
        txt: `${n} cuotas de ${money(each, planCur())} = ${money(round2(each * n), planCur())} en total${extra ? ` (${money(extra, planCur())} de interés)` : cuoMode === "total" ? ", sin interés" : ""}.${paid ? ` Te faltan ${n - paid}.` : ""} La última es en ${ln}.` };
    };
    const showDay = () => {

      b.querySelectorAll("#fIntKind button").forEach(x => x.setAttribute("aria-pressed", x.dataset.k === intKind));
      const ci = c && cuoInfo(); b.querySelector("#fCuoTxt").textContent = ci ? ci.txt : "";
    };
    b.querySelectorAll("#fCuoMode button").forEach(x => (x.onclick = () => { cuoMode = x.dataset.m; showDay(); }));
    b.querySelectorAll("#fIntOn button").forEach(x => (x.onclick = () => { intOn = x.dataset.i === "1"; showDay(); if (intOn) b.querySelector("#fIntR").focus(); }));
    b.querySelectorAll("#fIntKind button").forEach(x => (x.onclick = () => { intKind = x.dataset.k; showDay(); }));
    b.querySelector("#fIntR").addEventListener("input", showDay);
    [cuoN, cuoP, b.querySelector("#fAmt"), b.querySelector("#fDue")].forEach(x => x.addEventListener("input", showDay));
    segs.forEach(x => x.addEventListener("click", showDay));
    mon.onchange = showDay; cuo.onchange = showDay; showDay();
    const read = () => {
      const r = amtW.read();
      const err = b.querySelector("#fErr");
      if (!desc.value.trim()) { err.textContent = "Escribí qué es"; err.hidden = false; return null; }
      if (!r) { err.textContent = "Poné un monto"; err.hidden = false; return null; }
      if (r.error) { err.textContent = r.error; err.hidden = false; return null; }
      const amt = r.amount;
      if (cuo.checked && kind === "out") {
        const n = +cuoN.value, paid = +cuoP.value || 0;
        if (!Number.isInteger(n) || n < 2 || n > 72) { err.textContent = "Poné cuántas cuotas (de 2 a 72)"; err.hidden = false; return null; }
        if (!Number.isInteger(paid) || paid < 0 || paid >= n) { err.textContent = "Las cuotas pagadas tienen que ser menos que el total"; err.hidden = false; return null; }
        const ci = cuoInfo();
        if (intOn && cuoMode === "total" && !ci.int) { err.textContent = "Poné el interés (por ejemplo 20), o elegí Sin interés"; err.hidden = false; return null; }
        return { kind, desc: desc.value.trim(), amount: ci.each, currency: planCur(), usd: ci.eachUsd, tax: ci.eachUsd ? ci.tax : null, due: ci.first, cat: cat.value, accountId: acct.value, monthly: true, cuotas: { n, paid, ...(ci.price ? { price: ci.price } : {}), ...(ci.int ? { int: ci.int } : {}) } };
      }

function payPlanned(p, mk, amt, accountId, date) {

}

// ---------- Importar CSV del banco ----------
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const firstLines = text.split(/\r?\n/).slice(0, 20).join("\n");
  const count = ch => (firstLines.match(new RegExp(ch === "\t" ? "\\t" : "\\" + ch, "g")) || []).length;
  const delim = [";", ",", "\t", "|"].sort((a, b) => count(b) - count(a))[0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function parseDate(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    const y = m[3].length === 2 ? "20" + m[3] : m[3];
    return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  }
  return null;
}
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const COLS = {
  date: /^(fecha|date|fecha (de )?(operacion|movimiento|origen)|f\. ?operacion)/,
  desc: /(descrip|concepto|detalle|movimiento|referencia|leyenda|comercio|establecimiento|description)/,
  amount: /^(importe|monto|amount|valor|importe en pesos|monto bruto|total)/,
  debit: /(debito|debe|egreso|cargo|retiro)/,
  credit: /(credito|haber|ingreso|abono|deposito)/,
  balance: /^(saldo|balance)/,
};
function mapColumns(rows) {
  for (let h = 0; h < Math.min(rows.length, 25); h++) {
    const head = rows[h].map(norm);
    const find = (re, skip = []) => head.findIndex((c, i) => c && re.test(c) && !skip.includes(i));
    const date = find(COLS.date);
    if (date < 0) continue;
    const balance = find(COLS.balance);
    const debit = find(COLS.debit, [balance]);
    const credit = find(COLS.credit, [balance, debit]);
    const amount = find(COLS.amount, [balance, debit, credit]);
    const desc = find(COLS.desc, [date, balance, debit, credit, amount]);
    if (amount < 0 && (debit < 0 || credit < 0)) continue;
    return { header: h, date, desc, amount, debit, credit, balance };
  }
  return null;
}
function readStatement(text) {
  const rows = parseCSV(text);
  const m = mapColumns(rows);
  if (!m) { const r = readLines(text); return r.error ? readBlocks(text) : r; }
  const out = [];
  let lastBal = null, lastBalDate = null;
  for (const r of rows.slice(m.header + 1)) {
    const date = parseDate(r[m.date]);
    if (!date) continue;
    let amount;
    if (m.amount >= 0) amount = parseAmount(r[m.amount]);
    else {
      const d = parseAmount(r[m.debit]), c = parseAmount(r[m.credit]);
      amount = (isNaN(c) ? 0 : Math.abs(c)) - (isNaN(d) ? 0 : Math.abs(d));
    }
    if (isNaN(amount) || amount === 0) continue;
    const desc = (m.desc >= 0 ? r[m.desc] : "").replace(/\s+/g, " ").slice(0, 80);
    out.push({ date, amount, desc });
    if (m.balance >= 0) {
      const b = parseAmount(r[m.balance]);
      if (!isNaN(b) && (!lastBalDate || date >= lastBalDate)) { lastBal = b; lastBalDate = date; }
    }
  }
  if (!out.length) return { error: "El archivo no tiene movimientos que pueda leer." };
  return { txs: out, balance: lastBal, balanceDate: lastBalDate };
}
// Resúmenes en PDF o texto pegado: cada renglón que empieza con fecha y tiene montos es un movimiento.
// Si hay saldo al final del renglón, el signo sale de cómo cambia el saldo.
const LINE_AMT = /[-−]?\s?\$?\s?[-−]?\s?\d{1,3}(?:\.\d{3})*,\d{2}(?!\d)/g;
function readLines(text) {
  const t = todayISO();
  const rows = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\s+/g, " ").trim();
    const m = line.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/);
    if (!m) continue;
    let y = m[3] ? (m[3].length === 2 ? "20" + m[3] : m[3]) : t.slice(0, 4);
    let date = `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    if (!m[3] && date > t) date = `${+y - 1}${date.slice(4)}`;
    if (+m[2] < 1 || +m[2] > 12 || +m[1] < 1 || +m[1] > 31) continue;
    const rest = line.slice(m[0].length);
    const amts = [...rest.matchAll(LINE_AMT)];
    if (!amts.length) continue;
    const mov = amts.length >= 2 ? amts[amts.length - 2][0] : amts[0][0];
    rows.push({
      date, desc: rest.slice(0, amts[0].index).replace(/\s*\$\s*$/, "").trim().slice(0, 80),
      amount: parseAmount(mov), signed: /[-−]/.test(mov),
      bal: amts.length >= 2 ? parseAmount(amts[amts.length - 1][0]) : null,
    });
  }
  const ok = rows.filter(r => !isNaN(r.amount) && r.amount !== 0);
  if (!ok.length) return { error: "No encontré movimientos. Tiene que ser el resumen o los movimientos del banco, con fecha y monto en cada renglón." };
  // Ordenar del más viejo al más nuevo: probar el orden del archivo y el inverso, quedarse con el que cuadra con los saldos
  const fits = list => list.reduce((n, r, i) => n + (i > 0 && r.bal != null && list[i - 1].bal != null && Math.abs(round2(r.bal - list[i - 1].bal)) === Math.abs(r.amount) ? 1 : 0), 0);
  let seq = ok;
  const rev = [...ok].reverse();
  if (fits(rev) > fits(ok) || (fits(rev) === fits(ok) && ok[0].date > ok[ok.length - 1].date)) seq = rev;
  const anySigned = seq.some(r => r.signed);
  const out = seq.map((r, i) => {
    const prev = seq[i - 1];
    let amount = Math.abs(r.amount);
    if (prev && r.bal != null && prev.bal != null && Math.abs(round2(r.bal - prev.bal)) === amount) amount = r.bal < prev.bal ? -amount : amount;
    else if (r.signed) amount = r.amount;
    else if (!anySigned) amount = -amount;
    return { date: r.date, amount, desc: r.desc };
  });
  const withBal = seq.filter(r => r.bal != null);
  const last = withBal[withBal.length - 1];
  return { txs: out, balance: last ? last.bal : null, balanceDate: last ? last.date : null };
}

// Listas como las de la app del banco (o una captura de pantalla leída): la fecha va como título
// ("Hoy", "Ayer", "20 de octubre") o debajo del movimiento con la hora, y cada movimiento tiene nombre y monto.
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DATE_TXT = /\b(\d{1,2})\s*(?:de\s+)?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-z]*\.?(?:\s*(?:de\s+)?(\d{4}))?|\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/;
function looseDate(s) {
  const t = todayISO(), n = norm(s);
  if (/\bhoy\b/.test(n)) return t;
  if (/\bayer\b/.test(n)) { const d = new Date(t + "T12:00"); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
  const m = n.match(DATE_TXT);
  if (!m) return null;
  const d = +(m[1] || m[4]), mo = m[2] ? (m[2] === "set" ? 9 : MES.indexOf(m[2]) + 1) : +m[5];
  const yy = m[3] || m[6];
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  const y = yy ? (yy.length === 2 ? "20" + yy : yy) : t.slice(0, 4);
  let iso = `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  if (!yy && iso > t) iso = `${+y - 1}${iso.slice(4)}`;
  return iso;
}
const BLOCK_AMT = /([+\-−–]\s*)?\$\s*([+\-−–]\s*)?\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?(?!\d)|([+\-−–]\s*)?\d{1,3}(?:\.\d{3})*,\d{2}(?!\d)/;
const INCOME = /recib|te transf|transferencia de|ingres|devoluc|reintegro|cashback|deposit|rendimiento|acredit|cobraste|te envi/i;
const NOISE = /^(\d{1,2}:\d{2}(\s*hs)?|aprobad[oa]|pendiente|rechazad[oa]|ver (mas|más|todo)|movimientos|actividad|tu actividad)$/i;
const cleanDesc = s => s.replace(new RegExp(DATE_TXT.source, "gi"), "").replace(/\b(hoy|ayer)\b/gi, "").replace(/\d{1,2}:\d{2}(\s*hs)?/g, "").replace(/[|•·©®>]/g, " ").replace(/\s+/g, " ").replace(/^[^\p{L}\d]+|[^\p{L}\d)]+$/gu, "").trim();
// Lo que queda a la izquierda del monto en una captura suele ser el ícono y la hora: se descartan los pedacitos sueltos
const keepBefore = (before, pend) => cleanDesc(before).split(" ").filter(w => w.length > 2 && /\p{L}/u.test(w) && !norm(pend).split(/\s+/).some(p => p !== norm(w) && p.startsWith(norm(w)))).join(" ");
function readBlocks(text) {
  const out = [];
  let cur = null, pend = [], last = null, prevItem = false;
  for (const raw of text.split(/\r?\n/)) {
    // "$" mal leído como "S" o "8" (por ejemplo "+8 1.234,56")
    const line = raw.replace(/\s+/g, " ").trim().replace(/([+\-−–])\s*[8S]\s+(?=\d)/g, "$1$ ").replace(/(^|\s)S\s?(?=\d{1,3}(?:\.\d{3})*,\d{2})/g, "$1$ ");
    if (!line) continue;
    const am = line.match(BLOCK_AMT), dt = looseDate(line);
    if (am) {
      const p = cleanDesc(pend.join(" "));
      const desc = [p, keepBefore(line.slice(0, am.index), p)].filter(Boolean).join(" ") || cleanDesc(line.slice(0, am.index));
      pend = [];
      const amount = Math.abs(parseAmount(am[0]));
      if (!amount || /^(saldo|disponible|total|dinero disponible)/i.test(desc)) { prevItem = false; continue; }
      const sign = /[-−–]/.test(am[0]) ? -1 : /\+/.test(am[0]) ? 1 : INCOME.test(desc) ? 1 : -1;
      last = { date: dt || cur, own: !!dt, amount: sign * amount, desc: desc.slice(0, 80) };
      out.push(last); prevItem = true;
      continue;
    }
    if (dt) {
      // "20 oct 14:32" justo debajo de un movimiento es la fecha de ese movimiento; si no, es un título
      if (/\d{1,2}:\d{2}/.test(line) && last && prevItem && !last.own) { last.date = dt; last.own = true; }
      else { cur = dt; pend = []; }
      prevItem = false; continue;
    }
    prevItem = false;
    if (NOISE.test(line) || line.length < 3) continue;
    pend.push(line); if (pend.length > 2) pend.shift();
  }
  if (!out.length) return { error: "No encontré movimientos. Tienen que verse la fecha, el nombre y el monto de cada uno." };
  return { txs: out.map(({ date, amount, desc }) => ({ date, amount, desc })), balance: null, balanceDate: null };
}

const scripts = {};
function loadScript(src) {
  return scripts[src] || (scripts[src] = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok;
    s.onerror = () => { delete scripts[src]; fail(new Error("no cargó " + src)); };
    document.head.appendChild(s);
  }));
}
async function loadPdfjs() {
  await loadScript("pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  return pdfjsLib;
}

// Lee el texto de una captura de pantalla, en el celular y sin mandarla a ningún lado
let ocrWorker;
async function ocrText(file, onProgress) {
  await loadScript("ocr/tesseract.min.js");
  const base = new URL("ocr/", location.href).href;
  if (!ocrWorker) ocrWorker = Tesseract.createWorker("spa", 1, {
    workerPath: base + "worker.min.js", corePath: base.slice(0, -1), langPath: base.slice(0, -1), gzip: true,
    logger: m => m.status === "recognizing text" && onProgress && onProgress(m.progress),
  }).catch(e => { ocrWorker = null; throw e; });
  const worker = await ocrWorker;
  const bmp = await createImageBitmap(file);
  const c = document.createElement("canvas");
  c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(bmp, 0, 0);
  // Con el modo oscuro se lee mejor invertida: letras oscuras sobre fondo claro
  const px = g.getImageData(0, 0, c.width, c.height);
  let sum = 0;
  for (let i = 0; i < px.data.length; i += 40) sum += px.data[i] * .3 + px.data[i + 1] * .59 + px.data[i + 2] * .11;
  if (sum / (px.data.length / 40) < 110) {
    for (let i = 0; i < px.data.length; i += 4) { px.data[i] = 255 - px.data[i]; px.data[i + 1] = 255 - px.data[i + 1]; px.data[i + 2] = 255 - px.data[i + 2]; }
    g.putImageData(px, 0, 0);
  }
  return (await worker.recognize(c)).data.text;
}

// Arma los renglones del PDF juntando los textos que están a la misma altura
async function pdfText(buf) {
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({ data: buf }).promise;
  const lines = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const items = (await (await doc.getPage(n)).getTextContent()).items.filter(i => i.str.trim());
    const rows = [];
    for (const it of items) {
      const y = it.transform[5], x = it.transform[4];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if (!row) rows.push(row = { y, parts: [] });
      row.parts.push({ x, s: it.str });
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) lines.push(r.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(" "));
  }
  return lines.join("\n");
}

const txKey = (accountId, t) => `${accountId}|${t.date}|${round2(t.amount)}|${norm(t.desc).replace(/\s+/g, "")}`;

function formImport(a) {
  openSheet(`<h2>Importar en ${esc(a.name)}</h2>
    <div class="field"><span class="label">Capturas de pantalla</span>
      <p class="small">Abrí los movimientos en la app del banco, sacá capturas (que se vean la fecha, el nombre y el monto) y elegilas acá. Podés elegir varias; si se repiten partes entre capturas, no se duplican.</p>
      <input type="file" id="fShots" accept="image/*" multiple></div>
    <details><summary class="small">Otras formas: resumen PDF, CSV o pegar texto</summary>

      <textarea id="fPaste" rows="4" placeholder="20/10/2026  Compra Carrefour  -$ 45.320,50" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--card)"></textarea>

    <button class="btn ghost" data-close>Cancelar</button>`, b => {
    const out = b.querySelector("#fOut");
    b.querySelector("#fRead").onclick = () => show(readStatement(b.querySelector("#fPaste").value));
    b.querySelector("#fShots").onchange = async e => {
      const files = [...e.target.files]; if (!files.length) return;
      const counts = new Map(), txs = [];
      try {
        for (const [i, f] of files.entries()) {
          const say = p => (out.innerHTML = `<p class="muted">Leyendo captura ${i + 1} de ${files.length}… ${p == null ? "" : Math.round(p * 100) + "%"}</p>`);
          say(null);
          const res = readStatement(await ocrText(f, say));
          if (res.error) continue;
          // Entre capturas que se pisan, cada movimiento cuenta las veces que aparece en una sola captura
          const here = new Map();
          for (const t of res.txs) {
            const k = `${t.date}|${t.amount}|${norm(t.desc).replace(/[^a-z0-9]/g, "")}`;
            here.set(k, (here.get(k) || 0) + 1);
            if (here.get(k) > (counts.get(k) || 0)) { counts.set(k, here.get(k)); txs.push(t); }
          }
        }
      } catch { out.innerHTML = `<p class="err">No pude leer las capturas. La primera vez hace falta internet para cargar el lector.</p>`; return; }
      show(txs.length ? { txs, balance: null, balanceDate: null } : { error: "No encontré movimientos en las capturas. Fijate que se vean la fecha, el nombre y el monto." });
    };
    b.querySelector("#fFile").onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      const buf = await file.arrayBuffer();
      if (/\.pdf$/i.test(file.name) || file.type === "application/pdf") {
        out.innerHTML = `<p class="muted">Leyendo el PDF…</p>`;
        try { show(readLines(await pdfText(buf))); }
        catch { out.innerHTML = `<p class="err">No pude abrir el PDF. Si tiene contraseña, guardalo sin contraseña y probá de nuevo.</p>`; }
        return;
      }
      let text = new TextDecoder("utf-8").decode(buf);
      if (text.includes("�")) text = new TextDecoder("windows-1252").decode(buf);
      show(readStatement(text));
    };
    function show(res) {
      if (res.error) { out.innerHTML = `<p class="err">${esc(res.error)}</p>`; return; }
      let flip = false, noDate = todayISO();
      const undated = res.txs.some(t => !t.date);
      const paint = () => {
        const seen = new Set(db.txs.map(t => txKey(t.accountId, t)));
        const items = res.txs.map(t => ({ ...t, date: t.date || noDate, amount: flip ? -t.amount : t.amount })).map(t => ({ ...t, dup: seen.has(txKey(a.id, t)) }));
        const fresh = items.filter(t => !t.dup);
        out.innerHTML = `<p><b>${fresh.length}</b> movimientos nuevos${items.length > fresh.length ? ` · ${items.length - fresh.length} ya estaban` : ""}</p>
          <div class="preview">${items.map(t => `<div class="item ${t.dup ? "dup" : ""}"><span class="t">${esc(t.desc || "—")}</span><span class="a num ${t.amount < 0 ? "out" : "in"}">${t.amount < 0 ? "− " : "+ "}${money(Math.abs(t.amount), a.currency)}</span><span class="s">${shortDate(t.date)}</span></div>`).join("")}</div>
          ${undated ? `<label class="field"><span class="label">Fecha de los que no la muestran</span><input type="date" id="fNoDate" value="${noDate}"></label>` : ""}
          <p class="muted small">Revisá que estén bien. Después podés tocar cualquier movimiento en Gastos para corregirlo.</p>
          <label class="check"><input type="checkbox" id="fFlip" ${flip ? "checked" : ""}> Los gastos aparecen en verde (invertir signos)</label>
          ${res.balance != null && !flip ? `<label class="check"><input type="checkbox" id="fBal" checked> Usar el saldo del archivo: ${money(res.balance, a.currency)} al ${shortDate(res.balanceDate)}</label>` : ""}
          <button class="btn" id="fOk" ${fresh.length || res.balance != null ? "" : "disabled"}>Importar</button>`;
        out.querySelector("#fFlip").onchange = e2 => { flip = e2.target.checked; paint(); };
        const nd = out.querySelector("#fNoDate");
        if (nd) nd.onchange = () => { noDate = nd.value || todayISO(); paint(); };
        out.querySelector("#fOk").onclick = () => {
          const now = Date.now();
          for (const t of fresh) db.txs.push({ id: uid(), created: now, src: "import", accountId: a.id, date: t.date, amount: t.amount, desc: t.desc, cat: guessCat(t.desc, t.amount) });
          const useBal = out.querySelector("#fBal")?.checked;
          if (useBal) setBase(a, res.balance, res.balanceDate, now + 1);
          save(); closeSheet(); render();
          toast(`${fresh.length} movimientos importados${useBal ? " y saldo actualizado" : ""}`);
        };
      };
      paint();
    };
  });
}

function readBackup(text) {
  const raw = String(text || "").trim();
  const d = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
  if (!d || d.v !== 1 || !Array.isArray(d.accounts) || !Array.isArray(d.txs) || !Array.isArray(d.planned)) throw new Error("no es una copia");
  return d;
}
function applyBackup(d) {
  const n = d.accounts.length, m = d.txs.length, k = d.planned.length;
  if (!confirm(`La copia tiene ${n} cuenta${n === 1 ? "" : "s"}, ${m} movimiento${m === 1 ? "" : "s"} y ${k} planeado${k === 1 ? "" : "s"}. Reemplaza todo lo que hay ahora en la app. ¿Seguir?`)) return;
  dropInterest(d); db = d; save(); closeSheet(); render(); toast("Copia cargada");
}
function wipe() {
  const n = db.accounts.length + db.txs.length + db.planned.length;

  else if (d.act === "fxmanual") {

  }

    let last = monthKey(todayISO());
    for (const c of currencies()) for (const m of projection(c)) if (m.mk > last) last = m.mk;
    db.until = addMonths(last, 1); save(); render();
    const n = monthName(db.until); toast(`Agregado ${n}`);
  }
  else if (d.group) { const g = groupById(d.group); if (g) formGroup(g); }
  else if (d.gitem) { const p = db.planned.find(x => x.id === d.gitem); if (p) formGroupItem(p); }
  else if ("newgroup" in d) formNewGroup(d.newgroup);
  else if (d.addmonth) formPlan(null, { due: d.addmonth === monthKey(todayISO()) ? todayISO() : dayIn(d.addmonth, 1), accountId: lastAccount() });
  else if (d.plan) { const p = db.planned.find(p => p.id === d.plan); if (p) p.monthly && d.mk ? formMonth(p, d.mk) : formPlan(p); }
  else if (d.import) formImport(acctById(d.import));
  else if (d.adjust) formAdjust(acctById(d.adjust));
  else if (d.editacct) formAccount(acctById(d.editacct));
  else if (d.act === "addAccount") formAccount();
  else if (d.act === "quick") quickAdd();
  else if (d.act === "quickplan") quickPlan();
  else if (d.act === "quickin") quickAdd(true);
  else if (d.act === "quickcuotas") {
    const acc = acctById(document.getElementById("qAcct")?.value || lastAccount()), qa = quickAmount(acc, document.getElementById("qAmt").value);
    if (qa?.error) return;
    formPlan(null, { kind: "out", desc: document.getElementById("qDesc").value.trim(), amount: qa?.amount || "", usd: qa?.usd || null, tax: qa?.tax, accountId: acc?.id, cuotas: { n: "", paid: 0 }, cuoMode: "total" });
  }
  else if (d.act === "balance") { if (db.accounts.length === 1) formAdjust(db.accounts[0]); else { tab = "cuentas"; render(); document.getElementById("scroll").scrollTop = 0; } }
  else if (d.act === "start") {
    const name = document.getElementById("oName").value.trim() || "Mi cuenta", v = document.getElementById("oBal").value.trim();
    const base = v ? parseAmount(v) : 0;
    if (isNaN(base)) { toast("Poné cuánto tenés, en números"); return; }
    const acc = { id: uid(), name, currency: "ARS", base, baseDate: todayISO(), baseAt: Date.now() };
    db.accounts.push(acc);
    const pay = Math.abs(parseAmount(document.getElementById("oPay").value));
    if (pay) {
      const t = todayISO(), day = Math.min(31, Math.max(1, +document.getElementById("oDay").value || 1));
      const mk = day >= +t.slice(8) ? monthKey(t) : addMonths(monthKey(t), 1);
      db.planned.push({ id: uid(), created: Date.now(), kind: "in", desc: "Sueldo", amount: pay, currency: "ARS", due: dayIn(mk, day), cat: "Sueldo", accountId: acc.id, monthly: true });
    }
    save(); render();
  }
  else if (d.act === "addIncome") formPlan(null, { kind: "in", desc: "Sueldo", monthly: true, accountId: lastAccount() });
  else if (d.chip) { const c = frequent()[+d.chip]; if (!c) return; document.getElementById("qDesc").value = c.desc; const s = document.getElementById("qAcct"); if (s && acctById(c.accountId)) s.value = c.accountId; const amt = document.getElementById("qAmt"); if (amt.value.trim()) quickAdd(); else amt.focus(); }
  else if (d.act === "backup") backup();
  else if (d.act === "restore") restore();
  else if (d.act === "wipe") wipe();
});
// Los montos se escriben con puntos de miles solos: 600000 → 600.000 (los decimales van con coma)
function fmtTyping(v) {
  if (/[a-zñ]/i.test(v)) return v; // "600 mil", "3 millones": se deja como está
  const m = v.match(/^(\s*[+\-−]?\s*\$?\s*)([\d.]*)(,\d*)?$/);
  if (!m) return v;
  const digits = m[2].replace(/\./g, "");
  if (!digits) return v;
  return m[1] + digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (m[3] || "");
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.tagName === "INPUT" && el.inputMode === "decimal" && !el.hasAttribute("data-plain")) {
    let v = el.value;
    // Un punto recién escrito al final, sin coma, es la coma de los decimales
    if (e.data === "." && v.endsWith(".") && !v.includes(",")) v = v.slice(0, -1) + ",";
    const f = fmtTyping(v);
    if (f !== el.value) {
      // El cursor queda en el mismo lugar contando los números que tiene a la derecha
      const pos = el.selectionStart ?? el.value.length, right = el.value.slice(pos).replace(/[^\d,]/g, "").length;
      el.value = f;
      let i = f.length, n = 0;
      while (i > 0 && n < right) { i--; if (/[\d,]/.test(f[i])) n++; }
      try { el.setSelectionRange(i, i); } catch {}
    }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "qAmt") quickFx();
  if (e.target.id !== "qAmt") return;
  const inc = e.target.value.trim().startsWith("+");
  document.querySelector("[data-act=quick]").textContent = inc ? "Ya lo cobré" : "Ya lo pagué";
  document.querySelector("[data-act=quickplan]").textContent = inc ? "Lo voy a cobrar" : "Lo voy a pagar";
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "qAmt") { e.preventDefault(); const d = document.getElementById("qDesc"); d.value.trim() ? quickAdd() : d.focus(); }
  else if (e.target.id === "qDesc") { e.preventDefault(); quickAdd(); }
  else if (e.target.id === "gDesc") { e.preventDefault(); document.getElementById("gAmt").focus(); }
  else if (e.target.id === "gAmt") { e.preventDefault(); document.getElementById("gAdd").click(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "fxCasa") { if (e.target.value) { db.fxBase = e.target.value; db.fxManual = null; } refreshUsd(); save(); render(); return; }
  if (e.target.id === "qAcct") quickFx();
  if (e.target.id === "fUntil") { db.until = e.target.value; save(); render(); const n = monthName(db.until); toast(`Se ven los meses hasta ${n}`); return; }
  const f = e.target.dataset?.filt; if (!f) return;
  filt[f] = e.target.value; render();
});
document.getElementById("fab").onclick = () => {
  if (tab === "planeados") formPlan();
  else if (tab === "cuentas") formAccount();
  else formTx();
};
// Si otra pestaña cambió los datos, mostrar lo último
addEventListener("storage", e => { if (e.key === KEY) { db = load(); render(); } });

render();
// El dólar se busca al abrir, cada media hora y al volver a la app si pasó más de media hora
const fxOld = () => !fx?.at || Date.now() - fx.at > 30 * 60 * 1000;
if (fxOld()) fetchFx(); else refreshUsd();
setInterval(() => { if (fxOld()) fetchFx(); }, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && fxOld()) fetchFx(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
